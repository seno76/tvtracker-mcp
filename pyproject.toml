[project]
name = "tvtracker-mcp"
version = "0.1.0"
description = "MCP-сервер поверх TVmaze: поиск сериалов по описанию, трекинг просмотра, бэклог"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=2.0.0",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.scripts]
tvtracker = "tvtracker.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "anyio>=4.6",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tvtracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "unit: быстрые тесты домейна и форматирования, без сети и без БД",
    "integration: тесты поверх реальной SQLite и in-memory MCP-клиента",
    "regression: закреплённые сценарии, гоняются после каждого этапа",
    "contract: контракт MCP-примитивов (tools/list, resources/read, prompts/get)",
]
anyio_mode = "auto"

[tool.coverage.run]
source = ["src/tvtracker"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "RUF", "S", "ASYNC", "PT"]
ignore = [
    "S101",             # assert — нормальная форма проверки в тестах
    "RUF001", "RUF002", "RUF003",  # комментарии и докстринги на русском
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PT011"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "evals"]
warn_unreachable = true
