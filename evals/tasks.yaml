# 12 сценариев оценки. Метрики на каждый: число вызовов инструментов, токены ответа,
# достигнут ли результат. Дизайн правится по числам, а не по ощущениям.
#
# Пороги: типовой сценарий 1–2 вызова; ответ concise до ~600 токенов;
# сценарий 12 — не более 2000 токенов на вызов.
#
# Статус `locked` означает, что сценарий закреплён тестом в tests/regression/.

- id: 1
  ask: Сериал, где сотрудникам разделяют память
  expect: Severance в топ-3 выдачи show_search(by="description")
  max_calls: 1
  status: locked

- id: 2
  ask: Что посмотреть, свободен час
  expect: ответ без единого вызова инструмента ради истории — она приходит ресурсами
  max_calls: 1
  status: passing

- id: 3
  ask: Что вышло, пока меня не было две недели
  expect: сводка из tracking://backlog и tracking://schedule, ноль вызовов
  max_calls: 0
  status: passing

- id: 4
  ask: Отметь, что досмотрел второй сезон Severance
  expect: подтверждение и сразу следующая серия
  max_calls: 1
  status: passing

- id: 5
  ask: Серия, где они застряли в лифте
  expect: episode_search находит серию в отслеживаемом сериале
  max_calls: 1
  status: passing

- id: 6
  ask: Стоит ли продолжать смотреть X после третьего сезона
  expect: один вердикт с числами по сезонам, ровно один вызов show_profile
  max_calls: 1
  status: passing

- id: 7
  ask: Найди что-то похожее на то, что я оцениваю выше восьми
  expect: рекомендация опирается на tracking://taste
  max_calls: 1
  status: passing

- id: 8
  ask: Комедии до 30 минут, которые уже закончились
  expect: show_search без запроса, по одним фильтрам
  max_calls: 1
  status: locked

- id: 9
  ask: Несуществующий сериал
  expect: ошибка ведёт к верной второй попытке (подсказка про by="description")
  # Два вызова здесь — суть сценария, а не перерасход: первый обязан провалиться,
  # второй — попасть. Замер показал, что порог 1 был выставлен по невнимательности.
  max_calls: 2
  status: locked

- id: 10
  ask: Запрос во время 429
  expect: деградация с указанием, что локальный поиск и трекинг работают
  max_calls: 1
  status: locked

- id: 11
  ask: Спойлерный запрос по непросмотренной серии
  expect: описание скрыто, показан только факт наличия серии
  max_calls: 1
  status: locked

- id: 12
  ask: Сериал с 400+ сериями
  expect: контекст не взорвался, не более 2000 токенов на вызов
  max_calls: 1
  status: locked
